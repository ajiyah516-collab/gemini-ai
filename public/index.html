<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0b0d12;
      color: #fff;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      width: 450px;
      height: 450px;
      background: #4285f4;
      filter: blur(130px);
      opacity: .18;
      top: -180px;
      left: -100px;
      animation: glow 7s infinite alternate;
    }

    body::after {
      content: "";
      position: fixed;
      width: 400px;
      height: 400px;
      background: #a855f7;
      filter: blur(130px);
      opacity: .15;
      right: -150px;
      bottom: -150px;
      animation: glow 8s infinite alternate-reverse;
    }

    @keyframes glow {
      from { transform: scale(1); }
      to { transform: scale(1.35); }
    }

    .app {
      position: relative;
      z-index: 2;
      height: 100vh;
      max-width: 900px;
      margin: auto;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 70px;
      display: flex;
      align-items: center;
      padding: 0 18px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(20px);
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(135deg,#4285f4,#8b5cf6,#ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
      box-shadow: 0 0 30px rgba(66,133,244,.35);
      animation: pulse 3s infinite;
    }

    @keyframes pulse {
      50% { box-shadow: 0 0 45px rgba(139,92,246,.55); }
    }

    .title {
      margin-left: 12px;
    }

    .title h1 {
      font-size: 18px;
    }

    .title span {
      font-size: 11px;
      color: #9ca3af;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 25px 18px 140px;
      scroll-behavior: smooth;
    }

    .welcome {
      text-align: center;
      margin-top: 16vh;
      animation: fadeUp .8s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .gemini-icon {
      width: 75px;
      height: 75px;
      margin: auto;
      border-radius: 25px;
      background: linear-gradient(135deg,#4285f4,#9333ea,#ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      box-shadow: 0 0 60px rgba(99,102,241,.35);
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      50% { transform: translateY(-10px) rotate(2deg); }
    }

    .welcome h2 {
      margin-top: 22px;
      font-size: 28px;
      background: linear-gradient(90deg,#fff,#8ab4ff,#d8b4fe);
      -webkit-background-clip: text;
      color: transparent;
    }

    .welcome p {
      margin-top: 10px;
      color: #9ca3af;
      font-size: 14px;
    }

    .message {
      display: flex;
      margin: 18px 0;
      animation: messageIn .3s ease;
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 82%;
      padding: 13px 16px;
      border-radius: 18px;
      line-height: 1.55;
      font-size: 14px;
      white-space: pre-wrap;
    }

    .user .bubble {
      background: linear-gradient(135deg,#2563eb,#7c3aed);
      border-bottom-right-radius: 5px;
    }

    .ai .bubble {
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.08);
      border-bottom-left-radius: 5px;
    }

    .typing {
      display: flex;
      gap: 5px;
      padding: 5px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #8ab4ff;
      animation: typing .8s infinite alternate;
    }

    .typing span:nth-child(2) {
      animation-delay: .2s;
    }

    .typing span:nth-child(3) {
      animation-delay: .4s;
    }

    @keyframes typing {
      to {
        opacity: .2;
        transform: translateY(-5px);
      }
    }

    .input-area {
      position: absolute;
      bottom: 18px;
      left: 15px;
      right: 15px;
      padding: 7px;
      border-radius: 24px;
      background: rgba(20,23,32,.85);
      border: 1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(20px);
      box-shadow: 0 10px 40px rgba(0,0,0,.4);
      display: flex;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      padding: 12px;
      font-size: 14px;
      max-height: 100px;
      font-family: inherit;
    }

    textarea::placeholder {
      color: #6b7280;
    }

    button {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 16px;
      color: white;
      background: linear-gradient(135deg,#4285f4,#8b5cf6);
      font-size: 19px;
      cursor: pointer;
      transition: .2s;
    }

    button:hover {
      transform: scale(1.08);
    }

    button:active {
      transform: scale(.94);
    }

    button:disabled {
      opacity: .5;
    }

    @media (max-width:600px) {
      .welcome h2 {
        font-size: 24px;
      }

      .bubble {
        max-width: 88%;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="logo">✦</div>
    <div class="title">
      <h1>Gemini AI</h1>
      <span>AI Assistant • Online</span>
    </div>
  </header>

  <main id="chat">

    <div class="welcome" id="welcome">
      <div class="gemini-icon">✦</div>
      <h2>Halo, ada yang bisa saya bantu?</h2>
      <p>Tanyakan apa saja kepada Gemini AI</p>
    </div>

  </main>

  <div class="input-area">
    <textarea
      id="message"
      rows="1"
      placeholder="Tulis pesan..."
      onkeydown="handleKey(event)"
    ></textarea>

    <button id="send" onclick="sendMessage()">➤</button>
  </div>

</div>

<script>

const input = document.getElementById("message");
const chat = document.getElementById("chat");
const send = document.getElementById("send");
const welcome = document.getElementById("welcome");

function handleKey(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
}

function addMessage(text, type) {

  welcome.style.display = "none";

  const message = document.createElement("div");
  message.className = "message " + type;

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  message.appendChild(bubble);
  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;

  return message;
}

function addTyping() {

  welcome.style.display = "none";

  const message = document.createElement("div");
  message.className = "message ai";
  message.id = "typing";

  message.innerHTML = `
    <div class="bubble">
      <div class="typing">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  `;

  chat.appendChild(message);
  chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {

  const text = input.value.trim();

  if (!text || send.disabled) return;

  addMessage(text, "user");

  input.value = "";
  input.style.height = "auto";

  send.disabled = true;

  addTyping();

  try {

    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: text
      })
    });

    const data = await response.json();

    const typing = document.getElementById("typing");

    if (typing) {
      typing.remove();
    }

    if (!response.ok) {
      throw new Error(data.error || "Terjadi kesalahan");
    }

    addMessage(data.reply || "Tidak ada respons.", "ai");

  } catch (error) {

    const typing = document.getElementById("typing");

    if (typing) {
      typing.remove();
    }

    addMessage(
      "Maaf, terjadi kesalahan: " + error.message,
      "ai"
    );

  } finally {

    send.disabled = false;
    input.focus();

  }
}

input.addEventListener("input", function() {

  this.style.height = "auto";
  this.style.height =
    Math.min(this.scrollHeight, 100) + "px";

});

</script>

</body>
      </html>
